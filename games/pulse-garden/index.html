<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulse Garden</title>
<meta name="description" content="A rhythm game where every on-beat tap grows a glowing garden.">
<style>
  html, body { height: 100%; margin: 0; background: #0d0b1a; color: #e9e6ff; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #cv { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
  #seed {
    position: absolute; display: none; box-sizing: border-box; margin: 0; padding: 0 8px;
    background: #1f1a40; color: #e9e6ff; border: 1px solid #5b4fa0; border-radius: 8px;
    font: 16px system-ui, sans-serif; text-align: center; outline: none;
  }
  #seed:focus { border-color: #3ee6a8; }
  #seed::placeholder { color: #7d76a6; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="Pulse Garden game"></canvas>
  <input id="seed" type="text" inputmode="numeric" maxlength="10" placeholder="random" autocomplete="off" spellcheck="false" aria-label="Song seed (optional)">
</div>
<script>
(() => {
'use strict';

// ============================================================================
// PURE SECTION: song and chart generation.
// Deterministic functions of (seed, difficulty). No DOM, no audio, no clock.
// tools/tests extract the text between the @pure markers.
// ============================================================================
// @pure-begin
const DIFF_NAMES = ['Easy', 'Normal', 'Hard'];
const DIFFS = {
  Easy:   { bpm: [90, 100],  bars: 32, density: 0.25, downbeat: true,  chordP: 0,    holdP: 0,    speed: 280 },
  Normal: { bpm: [105, 115], bars: 48, density: 0.40, downbeat: false, chordP: 0,    holdP: 0.12, speed: 340 },
  Hard:   { bpm: [120, 130], bars: 48, density: 0.55, downbeat: false, chordP: 0.10, holdP: 0.12, speed: 420 },
};
const PENT = [0, 3, 5, 7, 10];   // minor pentatonic intervals
const PROG = [0, 3, 4, 2];       // bass/pad chord roots (pentatonic indices), 2 bars each
const LEAD_BEATS = 4;            // count-in: songTime starts at -4 beats

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

// Seeded PRNG (mulberry32).
function mulberry32(a) {
  a = a >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Pitch band -> lane: low (0), mid (1), high (2). Degrees 0..9 walk the scale.
function bandLane(d) { return d <= 3 ? 0 : d <= 6 ? 1 : 2; }
function bandDegrees(lane) { return lane === 0 ? [0, 1, 2, 3] : lane === 1 ? [4, 5, 6] : [7, 8, 9]; }
function melodyMidi(root, d) { return 57 + root + PENT[d % 5] + 12 * Math.floor(d / 5); }

// One 8-bar template (64 eighth slots). It repeats for every A or B block.
function makeTemplate(rng, D, start) {
  const out = [];
  let d = start;
  let lastBand = -1, bandRun = 0;   // consecutive notes in one pitch band (centering bias)
  for (let j = 0; j < 64; j++) {
    // Contour: step +-1 or +-2 on the scale, bouncing off the range edges.
    let step = rng() < 0.5 ? -1 : 1;
    if (rng() < 0.35) step *= 2;
    if (d <= 0) step = Math.abs(step);
    else if (d >= 9) step = -Math.abs(step);
    // Centering bias: after 6+ consecutive notes in a low or high band, steer toward the middle.
    if (bandRun >= 6 && lastBand !== 1) step = d < 4 ? Math.abs(step) : -Math.abs(step);
    d = Math.min(9, Math.max(0, d + step));

    const on = (D.downbeat && j % 8 === 0) || rng() < D.density;
    if (on) {
      const b = bandLane(d);
      bandRun = b === lastBand ? bandRun + 1 : 1;
      lastBand = b;
    }
    const n = { d, on, hold: 0, d2: -1 };
    if (on) {
      if (D.holdP > 0 && rng() < D.holdP) n.hold = 2 + Math.floor(rng() * 3); // 2..4 eighths
      if (D.chordP > 0 && rng() < D.chordP) {
        const other = (bandLane(d) + 1 + Math.floor(rng() * 2)) % 3; // a different lane
        const band = bandDegrees(other);
        n.d2 = band[Math.floor(rng() * band.length)];
      }
    }
    out.push(n);
  }
  return out;
}

// generateSong(seed, difficulty) -> { bpm, beat, slot, leadSec, endSec, speed, notes, layers }
// Times are seconds from the first beat of the song (the count-in is negative).
function generateSong(seedIn, diffName) {
  const D = DIFFS[diffName] || DIFFS.Normal;
  const seed = seedIn >>> 0;
  const di = Math.max(0, DIFF_NAMES.indexOf(diffName));
  const rng = mulberry32(seed ^ Math.imul(di + 1, 0x9e3779b9));

  const bpm = Math.round(D.bpm[0] + rng() * (D.bpm[1] - D.bpm[0]));
  const root = Math.floor(rng() * 12);
  const beat = 60 / bpm;
  const slot = beat / 2;
  const bars = D.bars;
  const totalBeats = bars * 4;
  const slotsTotal = bars * 8;

  // ---- Chart ----
  // Lane balance: the centering bias in makeTemplate, plus a deterministic resample. If a
  // lane gets under 15% of the song's notes, the chart is redrawn from the same PRNG stream
  // (the seed still fixes the result).
  let raw = [];
  for (let attempt = 0; attempt < 40; attempt++) {
    const tmpl = {
      A: makeTemplate(rng, D, 3 + Math.floor(rng() * 4)),
      B: makeTemplate(rng, D, 3 + Math.floor(rng() * 4)),
    };
    raw = [];
    for (let s = 0; s < slotsTotal; s++) {
      const block = Math.floor(s / 64);            // 8-bar block
      const letter = block % 4 === 2 ? 'B' : 'A';  // AABA phrasing
      const tn = tmpl[letter][s % 64];
      if (!tn.on) continue;
      raw.push({ t: s * slot, lane: bandLane(tn.d), pitch: melodyMidi(root, tn.d), hold: tn.hold * slot });
      if (tn.d2 >= 0) raw.push({ t: s * slot, lane: bandLane(tn.d2), pitch: melodyMidi(root, tn.d2), hold: 0 });
    }
    const cnt = [0, 0, 0];
    for (const n of raw) cnt[n.lane]++;
    if (raw.length && Math.min(cnt[0], cnt[1], cnt[2]) >= 0.15 * raw.length) break;
  }
  // Holds must not overlap the next note in the same lane: shorten them, leaving one
  // eighth of gap. A hold shorter than two eighths becomes a tap.
  for (let lane = 0; lane < 3; lane++) {
    const list = raw.filter((n) => n.lane === lane);
    list.forEach((n, i) => {
      if (!n.hold) return;
      const nx = list[i + 1];
      if (nx) {
        const maxLen = nx.t - slot - n.t;
        if (n.hold > maxLen) n.hold = maxLen;
      }
      if (n.hold < 2 * slot - 1e-9) n.hold = 0;
    });
  }
  const notes = raw.map((n, id) => ({
    id, t: n.t, lane: n.lane, pitch: n.pitch, hold: n.hold, end: n.t + n.hold,
  }));

  // ---- Layers (kick, hat, bass, pad) ----
  const kick = [];
  for (let b = -LEAD_BEATS; b < totalBeats; b++) kick.push({ t: b * beat });
  const hat = [];
  for (let k = 0; k < totalBeats * 2; k++) hat.push({ t: k * slot });
  const bass = [];
  const pad = [];
  for (let bar = 0; bar < bars; bar++) {
    const idx = PROG[Math.floor(bar / 2) % PROG.length];
    const r = 36 + root + PENT[idx];
    bass.push({ t: bar * 4 * beat, midi: r, dur: beat * 1.8 });
    bass.push({ t: (bar * 4 + 2) * beat, midi: r + 7, dur: beat * 1.8 });
    if (bar % 2 === 0) {
      const midis = [0, 2, 4].map((o) => {
        const k = idx + o;
        return 48 + root + PENT[k % 5] + 12 * Math.floor(k / 5);
      });
      pad.push({ t: bar * 4 * beat, dur: 8 * beat, midis });
    }
  }

  const lastEnd = notes.reduce((m, n) => Math.max(m, n.end), 0);
  return {
    seed, difficulty: diffName, bpm, root, beat, slot, bars,
    leadSec: LEAD_BEATS * beat,
    lengthSec: totalBeats * beat,
    endSec: Math.max(totalBeats * beat, lastEnd + 0.5),
    speed: D.speed,
    notes,
    layers: { kick, hat, bass, pad },
  };
}

// Grade from accuracy percent.
function gradeFor(acc) {
  return acc >= 95 ? 'S' : acc >= 88 ? 'A' : acc >= 78 ? 'B' : acc >= 65 ? 'C' : 'D';
}
// @pure-end

// ============================================================================
// CONSTANTS (layout, judgment windows, palette)
// ============================================================================
const W = 480, H = 720;            // logical canvas, scaled to the window
const PLAYTOP = 44;                // below the HUD strip
const HIT_Y = 600;                 // the seed ring
const PAD_TOP = 480;               // hit pads = bottom third of the screen
const LANE_W = W / 3;
const LANE_X = [W / 6, W / 2, (5 * W) / 6];
const LANE_RGB = [[62, 230, 168], [122, 162, 255], [255, 122, 217]];
const LANE_COL = LANE_RGB.map((c) => `rgb(${c.join(',')})`);
const GREY = [107, 100, 128];
const GOLD = '#ffd66b', MINT = '#3ee6a8', MISS_RED = '#ff6b6b', INK = '#e9e6ff';
const LANE_KEYS = { KeyJ: 0, ArrowLeft: 0, KeyK: 1, ArrowDown: 1, KeyL: 2, ArrowRight: 2 };
const PERFECT_WIN = 0.045, GOOD_WIN = 0.090, HOLD_TAIL = 0.060;
const LOOKAHEAD = 0.10, SCHED_MS = 25;
const W_PERFECT = 1.0, W_GOOD = 0.7;   // accuracy weights (spec leaves these open)
const START_GROWTH = 25;
const FLOWER_AT = [40, 70, 95];
const CAL_BEAT = 0.6;                  // calibration clicks at 100 BPM
const GRADE_RANK = { S: 5, A: 4, B: 3, C: 2, D: 1 };
const LAYERS = ['kick', 'hat', 'bass', 'pad'];

// ============================================================================
// DOM + LOGICAL STATE
// ============================================================================
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
const seedEl = document.getElementById('seed');
const stage = document.getElementById('stage');

let state = 'title';           // title | calibrate | playing | paused | results
let diffSel = 1;               // index into DIFF_NAMES (Normal)
let run = null;                // the current song
let cal = null;                // the calibration session
let offset = loadOffset();     // seconds; applied to judgment
let best = loadBest();         // { Easy: {grade, score}, ... }
let ui = [];                   // clickable rects drawn this frame
let shake = 0;
const parts = [];              // petal/spark particles (visual only)
const texts = [];              // floating judgment text (visual only)
const laneFlash = [0, 0, 0];
const heldCount = [0, 0, 0];   // how many keys/pointers hold each lane
const keysDown = new Set();    // lane key codes currently down
const ptrLane = new Map();     // pointerId -> lane
let noAudio = false;
let titleNote = '';            // short one-off message on the title screen
let titleNoteUntil = 0;

// window.__game: getters keep it live for the smoke test and the bot.
const G = Object.defineProperties(
  { chart: [], judgments: [] },
  {
    state: { get: () => state, enumerable: true },
    score: { get: () => (run ? run.score : 0), enumerable: true },
    combo: { get: () => (run ? run.combo : 0), enumerable: true },
    maxCombo: { get: () => (run ? run.maxCombo : 0), enumerable: true },
    songTime: { get: () => songNow(), enumerable: true },
    accuracy: { get: () => accuracyOf(run), enumerable: true },
    grade: { get: () => (run && run.grade) || null, enumerable: true },
    difficulty: { get: () => (run ? run.diff : DIFF_NAMES[diffSel]), enumerable: true },
    seed: { get: () => (run ? run.seed : 0), enumerable: true },
    offset: { get: () => offset, enumerable: true },
    audioTime: { get: () => (ac ? ac.currentTime : 0), enumerable: true },
    calBase: { get: () => (cal ? cal.base : null), enumerable: true },
    plants: { get: () => (run ? run.plants.map((p) => Math.round(p.growth)) : []), enumerable: true },
    counts: { get: () => (run ? { ...run.counts } : {}), enumerable: true },
  }
);
window.__game = G;

// ============================================================================
// STORAGE (always wrapped: private windows can throw)
// ============================================================================
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
function loadOffset() {
  const v = parseFloat(lsGet('pulseGarden.offset'));
  return Number.isFinite(v) ? clamp(v, -0.3, 0.3) : 0;
}
function loadBest() {
  try {
    const v = JSON.parse(lsGet('pulseGarden.best') || '{}');
    return v && typeof v === 'object' ? v : {};
  } catch (e) { return {}; }
}
function saveBest() { lsSet('pulseGarden.best', JSON.stringify(best)); }
function recordBest(diff, grade, score) {
  const cur = best[diff];
  if (!cur || GRADE_RANK[grade] > GRADE_RANK[cur.grade] || (grade === cur.grade && score > cur.score)) {
    best[diff] = { grade, score };
    saveBest();
  }
}

// ============================================================================
// LAYOUT (letterboxed, DPR-aware)
// ============================================================================
let minFont = 16;   // logical; raised on small screens so text stays >= 13 CSS px
function layout() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  minFont = Math.max(16, 13 / scale);
  const cw = Math.max(1, Math.floor(W * scale));
  const ch = Math.max(1, Math.floor(H * scale));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  stage.style.width = cw + 'px';
  stage.style.height = ch + 'px';
  // The seed field sits over the canvas at the title's seed row (logical 150,302 180x36).
  seedEl.style.left = (150 * cw) / W + 'px';
  seedEl.style.top = (302 * ch) / H + 'px';
  seedEl.style.width = (180 * cw) / W + 'px';
  seedEl.style.height = (36 * ch) / H + 'px';
}
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
}

// ============================================================================
// AUDIO (WebAudio, all synthesized). The AudioContext is created on the first gesture.
// ============================================================================
let ac = null, master = null, noiseBuf = null;

function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { noAudio = true; return false; }
    try { ac = new AC(); } catch (e) { noAudio = true; return false; }
    master = ac.createGain();
    master.gain.value = 0.7;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp);
    comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended' && state !== 'paused') ac.resume().catch(() => {});
  return true;
}

const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

function newBus() {
  const g = ac.createGain();
  g.connect(master);
  return g;
}
// Fade a bus out and detach it, so pending nodes on it go silent.
function killBus(bus) {
  if (!bus || !ac) return;
  try { bus.gain.setTargetAtTime(0, ac.currentTime, 0.02); } catch (e) { /* ignore */ }
  setTimeout(() => { try { bus.disconnect(); } catch (e) { /* ignore */ } }, 150);
}

function sKick(w, out) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, w);
  o.frequency.exponentialRampToValueAtTime(40, w + 0.12);
  g.gain.setValueAtTime(0.9, w);
  g.gain.exponentialRampToValueAtTime(0.001, w + 0.25);
  o.connect(g); g.connect(out);
  o.start(w); o.stop(w + 0.27);
}
function sHat(w, out) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf;
  f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(0.08, w);
  g.gain.exponentialRampToValueAtTime(0.001, w + 0.05);
  s.connect(f); f.connect(g); g.connect(out);
  s.start(w, Math.random() * 0.3); s.stop(w + 0.06);
}
function sBass(w, out, midi, dur) {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = mtof(midi);
  f.type = 'lowpass'; f.frequency.value = 500;
  g.gain.setValueAtTime(0.0001, w);
  g.gain.exponentialRampToValueAtTime(0.22, w + 0.02);
  g.gain.setValueAtTime(0.22, w + dur - 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, w + dur);
  o.connect(f); f.connect(g); g.connect(out);
  o.start(w); o.stop(w + dur + 0.02);
}
function sPad(w, out, midis, dur) {
  const f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = 1100; f.Q.value = 0.5;
  g.gain.setValueAtTime(0.0001, w);
  g.gain.exponentialRampToValueAtTime(0.035, w + 0.3);
  g.gain.setValueAtTime(0.035, w + dur - 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, w + dur);
  f.connect(g); g.connect(out);
  for (const m of midis) {
    for (const det of [-7, 7]) {
      const o = ac.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
      o.connect(f); o.start(w); o.stop(w + dur + 0.02);
    }
  }
}
// The melody note: plucked only when the player hits it.
function pluck(midi) {
  if (!ac) return;
  const w = ac.currentTime + 0.005;
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = mtof(midi);
  f.type = 'lowpass'; f.frequency.value = 2600;
  g.gain.setValueAtTime(0.12, w);
  g.gain.exponentialRampToValueAtTime(0.001, w + 0.35);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(w); o.stop(w + 0.4);
}
// A soft, muted click for a miss.
function clickMiss() {
  if (!ac) return;
  const w = ac.currentTime + 0.005;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf;
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(0.05, w);
  g.gain.exponentialRampToValueAtTime(0.001, w + 0.03);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(w, Math.random() * 0.3); s.stop(w + 0.04);
}
function clickBeat(w, accent, out) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = accent ? 1500 : 1000;
  g.gain.setValueAtTime(0.2, w);
  g.gain.exponentialRampToValueAtTime(0.001, w + 0.04);
  o.connect(g); g.connect(out);
  o.start(w); o.stop(w + 0.05);
}

// Lookahead scheduler (setInterval, every 25 ms): schedules the next 100 ms of events
// onto the audio clock. Rendering reads the same clock, so audio and visuals stay in sync.
const cursorOf = () => ({ kick: 0, hat: 0, bass: 0, pad: 0 });
function schedulerTick() {
  if (!run || !run.bus || !ac) return;
  const horizon = ac.currentTime + LOOKAHEAD;
  for (const name of LAYERS) {
    const list = run.song.layers[name];
    let c = run.cursor[name];
    while (c < list.length) {
      const ev = list[c];
      const w = run.base + run.song.leadSec + ev.t;
      if (w >= horizon) break;
      if (w >= ac.currentTime - 0.02) {
        if (name === 'kick') sKick(w, run.bus);
        else if (name === 'hat') sHat(w, run.bus);
        else if (name === 'bass') sBass(w, run.bus, ev.midi, ev.dur);
        else sPad(w, run.bus, ev.midis, ev.dur);
      }
      c++;
    }
    run.cursor[name] = c;
  }
}
setInterval(schedulerTick, SCHED_MS);

// Song time in seconds, from the audio clock only. It starts at -leadSec (count-in)
// and does not advance while the context is suspended (pause).
function songNow() {
  if (!run || !ac) return 0;
  return ac.currentTime - run.base - run.song.leadSec;
}

// ============================================================================
// RUN: start, finish, accounting
// ============================================================================
function startRun(diffName, seed) {
  if (!ensureAudio()) return;
  titleNote = '';
  ac.resume().catch(() => {});
  killBus(run && run.bus);
  killBus(cal && cal.bus);
  cal = null;
  const song = generateSong(seed, diffName);
  parts.length = 0;
  texts.length = 0;
  shake = 0;
  laneFlash.fill(0);
  run = {
    song, seed, diff: diffName,
    base: ac.currentTime + 0.15,
    bus: newBus(),
    cursor: cursorOf(),
    notes: song.notes.map((n) => ({
      id: n.id, t: n.t, end: n.end, hold: n.hold, lane: n.lane, pitch: n.pitch,
      st: 'wait', grade: null, w: 0, dt: null, dropped: false,
    })),
    plants: [0, 1, 2].map((l) => makePlant(l, seed)),
    score: 0, combo: 0, maxCombo: 0, weightSum: 0, judged: 0,
    counts: { Perfect: 0, Good: 0, Miss: 0, Hold: 0, Dropped: 0, Stray: 0 },
    log: [], withered: false, done: false, grade: null, acc: 0,
  };
  G.chart = run.notes;
  G.judgments = run.log;
  setState('playing');
  schedulerTick();
}

function accuracyOf(r) {
  return r && r.judged ? (r.weightSum / r.judged) * 100 : 0;
}

function finishRun(withered) {
  if (!run || run.done) return;
  if (withered) {
    // Accuracy covers every chart note reached so far; passed notes still waiting count as misses.
    const adj = songNow() - offset;
    for (const n of run.notes) if (n.st === 'wait' && adj - n.t > GOOD_WIN) judgeMiss(n);
  }
  run.done = true;
  run.withered = withered;
  killBus(run.bus);
  run.bus = null;
  const acc = accuracyOf(run);
  run.acc = acc;
  run.grade = withered ? 'D' : gradeFor(acc);   // a withered garden is capped at D
  for (const p of run.plants) p.show = p.growth;
  recordBest(run.diff, run.grade, run.score);
  setState('results');
}

function setState(s) {
  state = s;
  seedEl.style.display = s === 'title' ? 'block' : 'none';
}

function goTitle() {
  killBus(run && run.bus);
  run = null;
  killBus(cal && cal.bus);
  cal = null;
  G.chart = [];
  G.judgments = [];
  setState('title');
}

function togglePause() {
  if (state === 'playing') {
    setState('paused');
    if (ac) ac.suspend().catch(() => {});
  } else if (state === 'paused') {
    setState('playing');
    if (ac) ac.resume().catch(() => {});
    recheckHolds();
  }
}

function startFromTitle() {
  const digits = seedEl.value.replace(/\D/g, '').slice(0, 10);
  const seed = digits ? Number(digits) % 4294967296 : 1 + Math.floor(Math.random() * 999999999);
  seedEl.value = '';
  seedEl.blur();
  startRun(DIFF_NAMES[diffSel], seed);
}
function replay() { if (run) startRun(run.diff, run.seed); }
function newSong() { if (run) startRun(run.diff, 1 + Math.floor(Math.random() * 999999999)); }

// ============================================================================
// PLANTS (one per lane; growth 0..100)
// ============================================================================
function makePlant(lane, seed) {
  const r = mulberry32(seed ^ Math.imul(lane + 1, 0x85ebca6b));
  const jit = [];
  for (let i = 0; i < 64; i++) jit.push(r());   // fixed per song, so the shape is stable
  return {
    lane, growth: START_GROWTH, show: START_GROWTH, jit, ji: 0,
    tips: [], flowers: [false, false, false],
  };
}

function growPlant(lane, delta) {
  const p = run.plants[lane];
  p.growth = clamp(p.growth + delta, 0, 100);
  for (let i = 0; i < FLOWER_AT.length; i++) {
    const on = p.growth >= FLOWER_AT[i];
    if (on && !p.flowers[i]) burstAt(lane, 14);
    p.flowers[i] = on;
  }
}

function mixRGB(a, b, k) {
  const m = (i) => Math.round(a[i] + (b[i] - a[i]) * k);
  return `rgb(${m(0)},${m(1)},${m(2)})`;
}

function drawPlant(c, p, sc, rx, ry) {
  const g = p.show;
  const wilt = clamp((50 - g) / 50, 0, 1);   // 0 = lush, 1 = wilted
  const col = mixRGB(LANE_RGB[p.lane], GREY, wilt * 0.8);
  const depth = 1 + Math.min(4, Math.floor(g / 22));
  // Fit the plant inside its lane: measure the unit-scale extent (geometry is linear in
  // scale), then shrink if it would cross the lane edges or the top of the playfield.
  const len1 = (12 + g * 0.5) * (1 - wilt * 0.2);
  const st = { rx, w: 0, top: ry, i: 0 };
  measure(p, rx, ry, 0, len1, depth, wilt, st);
  const fit = Math.min(sc, (LANE_W / 2 - 6) / Math.max(st.w, 1), (ry - 36) / Math.max(ry - st.top, 1));
  sc = fit;
  const len = len1 * sc;
  p.ji = 0;
  p.tips = [];
  c.save();
  c.globalAlpha = 0.55 + 0.45 * (g / 100);
  c.strokeStyle = col;
  c.fillStyle = col;
  c.lineCap = 'round';
  branch(c, p, rx, ry, 0, len, depth, wilt, sc);
  for (let i = 0; i < FLOWER_AT.length; i++) {
    if (!p.flowers[i] || !p.tips.length) continue;
    const tip = p.tips[(i * 3 + p.lane) % p.tips.length];
    flower(c, tip[0], tip[1], sc * (1 + i * 0.15), i);
  }
  c.restore();
}

// Same walk as branch(), without drawing: records the horizontal reach and top height.
function measure(p, x, y, ang, len, depth, wilt, st) {
  const ex = x + Math.sin(ang) * len;
  const ey = y - Math.cos(ang) * len;
  st.w = Math.max(st.w, Math.abs(ex - st.rx));
  st.top = Math.min(st.top, ey);
  if (depth <= 0) return;
  const j1 = p.jit[st.i++ & 63];
  const j2 = p.jit[st.i++ & 63];
  const spread = 0.38 + j1 * 0.3 + wilt * 0.35;
  const k = 0.7 + j2 * 0.12;
  measure(p, ex, ey, ang - spread, len * k, depth - 1, wilt, st);
  measure(p, ex, ey, ang + spread, len * k, depth - 1, wilt, st);
}

// Recursive branching stem. Jitter values come from the fixed per-plant table.
function branch(c, p, x, y, ang, len, depth, wilt, sc) {
  const ex = x + Math.sin(ang) * len;
  const ey = y - Math.cos(ang) * len;
  c.lineWidth = Math.max(1, depth * 1.2 * sc);
  c.beginPath();
  c.moveTo(x, y);
  c.lineTo(ex, ey);
  c.stroke();
  if (depth <= 0) {
    p.tips.push([ex, ey]);
    c.beginPath();
    c.arc(ex, ey, 3 * sc, 0, Math.PI * 2);
    c.fill();
    return;
  }
  const j1 = p.jit[p.ji++ & 63];
  const j2 = p.jit[p.ji++ & 63];
  const spread = 0.38 + j1 * 0.3 + wilt * 0.35;   // wilted stems splay outward
  const k = 0.7 + j2 * 0.12;
  branch(c, p, ex, ey, ang - spread, len * k, depth - 1, wilt, sc);
  branch(c, p, ex, ey, ang + spread, len * k, depth - 1, wilt, sc);
}

function flower(c, x, y, sc, i) {
  const colors = ['#ffb3ec', GOLD, '#ffffff'];
  c.save();
  c.fillStyle = colors[i];
  for (let k = 0; k < 5; k++) {
    const a = (k / 5) * Math.PI * 2;
    c.beginPath();
    c.arc(x + Math.cos(a) * 5 * sc, y + Math.sin(a) * 5 * sc, 3.6 * sc, 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = '#fff6c2';
  c.beginPath();
  c.arc(x, y, 2.6 * sc, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

// ============================================================================
// JUDGMENT
// ============================================================================
// Press on a lane: take the nearest pending note in that lane within the Good window.
// Audio-clock time of an input event: current audio time minus the event's age.
function audioTimeOf(e) {
  if (!ac) return 0;
  const age = (performance.now() - e.timeStamp) / 1000;
  return ac.currentTime - (age > 0 && age < 0.5 ? age : 0);
}

function pressLane(lane, evT) {
  if (!run) return;
  const at = evT === undefined ? songNow() + run.song.leadSec + run.base : evT;
  const s = at - run.base - run.song.leadSec - offset;
  let target = null, bd = Infinity;
  for (const n of run.notes) {
    if (n.t - s > GOOD_WIN) break;   // notes are sorted by time
    if (n.lane !== lane || n.st !== 'wait') continue;
    const d = Math.abs(s - n.t);
    if (d <= GOOD_WIN && d < bd) { bd = d; target = n; }
  }
  laneFlash[lane] = 1;
  if (!target) {
    // Stray press: no note within the Good window in this lane. It breaks the combo and
    // costs this lane's plant -0.5 growth (no accuracy change).
    run.combo = 0;
    run.counts.Stray++;
    growPlant(lane, -0.5);
    return;
  }
  const dt = s - target.t;
  target.dt = dt;
  judgeHit(target, Math.abs(dt) <= PERFECT_WIN ? 'Perfect' : 'Good');
  target.st = target.hold > 0 ? 'hold' : 'done';
  pluck(target.pitch);
}

function judgeHit(n, grade) {
  const r = run;
  const w = grade === 'Perfect' ? W_PERFECT : W_GOOD;
  n.grade = grade;
  n.w = w;
  r.judged++;
  r.weightSum += w;
  r.counts[grade]++;
  r.combo++;
  r.maxCombo = Math.max(r.maxCombo, r.combo);
  const mult = 1 + Math.min(r.combo / 50, 1);
  r.score += Math.round((grade === 'Perfect' ? 300 : 100) * mult);
  growPlant(n.lane, grade === 'Perfect' ? 1.2 : 0.7);
  const x = LANE_X[n.lane];
  texts.push({ x, y: HIT_Y - 48, t: grade.toUpperCase(), c: grade === 'Perfect' ? GOLD : MINT, life: 0.7, max: 0.7 });
  spark(x, HIT_Y, LANE_COL[n.lane], grade === 'Perfect' ? 16 : 8);
  r.log.push({ id: n.id, t: n.t, lane: n.lane, grade, dt: n.dt });
  if (r.combo === 25 || r.combo === 50 || r.combo === 100) {
    for (let l = 0; l < 3; l++) burstAt(l, 10);
    texts.push({ x: W / 2, y: 260, t: `COMBO ${r.combo}`, c: GOLD, life: 1.0, max: 1.0 });
  }
}

function judgeMiss(n) {
  const r = run;
  n.st = 'done';
  n.grade = 'Miss';
  n.w = 0;
  r.judged++;
  r.counts.Miss++;
  r.combo = 0;
  growPlant(n.lane, -1.5);
  texts.push({ x: LANE_X[n.lane], y: HIT_Y - 48, t: 'MISS', c: MISS_RED, life: 0.7, max: 0.7 });
  shake = Math.max(shake, 5);
  clickMiss();
  r.log.push({ id: n.id, t: n.t, lane: n.lane, grade: 'Miss', dt: null });
}

// A hold is complete when it is still held at end - 60 ms.
function completeHold(n) {
  const r = run;
  n.st = 'done';
  n.completed = true;
  r.counts.Hold++;
  r.score += Math.round(50 * (1 + Math.min(r.combo / 50, 1)));
  texts.push({ x: LANE_X[n.lane], y: HIT_Y - 70, t: 'HOLD', c: GOLD, life: 0.8, max: 0.8 });
  spark(LANE_X[n.lane], HIT_Y, LANE_COL[n.lane], 10);
  r.log.push({ id: n.id, t: n.t, lane: n.lane, grade: 'Hold', dt: null });
}

// Released too early: the note's accuracy weight is removed and it counts as a miss.
function dropHold(n) {
  const r = run;
  n.st = 'done';
  n.dropped = true;
  r.weightSum -= n.w;
  n.w = 0;
  r.counts.Dropped++;
  r.combo = 0;
  growPlant(n.lane, -1.5);
  texts.push({ x: LANE_X[n.lane], y: HIT_Y - 70, t: 'DROPPED', c: MISS_RED, life: 0.8, max: 0.8 });
  clickMiss();
  r.log.push({ id: n.id, t: n.t, lane: n.lane, grade: 'Dropped', dt: null });
}

function releaseLane(lane) {
  if (!run) return;
  const s = songNow() - offset;
  for (const n of run.notes) {
    if (n.st === 'hold' && n.lane === lane) {
      if (s >= n.end - HOLD_TAIL) completeHold(n);
      else dropHold(n);
    }
  }
}

function burstAt(lane, count) {
  const p = run && run.plants[lane];
  const pts = p && p.tips.length ? p.tips : [[LANE_X[lane], 232]];
  for (let i = 0; i < count; i++) {
    const t = pts[Math.floor(Math.random() * pts.length)];
    spark(t[0], t[1], LANE_COL[lane], 1, 90, 'petal');
  }
}

// Visual-only particles (Math.random is fine here: nothing game-timed depends on it).
function spark(x, y, color, n, speed = 160, kind = 'spark') {
  for (let i = 0; i < n; i++) {
    if (parts.length > 420) return;
    const a = Math.random() * Math.PI * 2;
    const v = (0.3 + Math.random() * 0.7) * speed;
    parts.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.6 + Math.random() * 0.5,
      max: 1.1, c: color, s: kind === 'petal' ? 3.5 : 2.2, kind,
    });
  }
}

function updateRun(dt) {
  const s = songNow();
  const adj = s - offset;
  for (const n of run.notes) {
    if (n.st === 'wait') {
      if (adj - n.t > GOOD_WIN) judgeMiss(n);
    } else if (n.st === 'hold') {
      if (adj >= n.end - HOLD_TAIL) completeHold(n);
    }
  }
  for (const p of run.plants) p.show += (p.growth - p.show) * Math.min(1, dt * 5);
  if (run.plants.every((p) => p.growth <= 0)) { finishRun(true); return; }
  if (s >= run.song.endSec) finishRun(false);
}

// ============================================================================
// CALIBRATION: 4 count-in clicks, then 4 tap beats; offset = median tap delay.
// ============================================================================
function startCal() {
  if (!ensureAudio()) return;
  titleNote = '';
  ac.resume().catch(() => {});
  killBus(run && run.bus);
  run = null;
  killBus(cal && cal.bus);
  const bus = newBus();
  cal = { bus, base: ac.currentTime + 0.2, taps: [false, false, false, false], deltas: [], done: false, msg: '' };
  for (let k = 0; k < 8; k++) clickBeat(cal.base + k * CAL_BEAT, k === 0, bus);
  setState('calibrate');
}

function calTap(evT) {
  if (!cal || cal.done || !ac) return;
  const t = evT === undefined ? ac.currentTime : evT;
  const k = Math.round((t - cal.base) / CAL_BEAT);
  if (k < 4 || k > 7 || cal.taps[k - 4]) return;
  const delta = t - (cal.base + k * CAL_BEAT);
  if (Math.abs(delta) > 0.2) return;
  cal.taps[k - 4] = true;
  cal.deltas.push(delta);
  spark(W / 2, 300, GOLD, 8);
}

function updateCal() {
  if (!cal || cal.done || !ac) return;
  if (ac.currentTime > cal.base + 7 * CAL_BEAT + 0.4) {
    cal.done = true;
    if (cal.deltas.length >= 3) {
      offset = clamp(median(cal.deltas), -0.3, 0.3);
      lsSet('pulseGarden.offset', String(offset));
      cal.msg = `Offset set to ${Math.round(offset * 1000)} ms`;
    } else {
      cal.msg = 'Not enough taps (need 3 of 4). Offset unchanged.';
    }
  }
}

function median(a) {
  const b = a.slice().sort((x, y) => x - y);
  const m = b.length >> 1;
  return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2;
}

// ============================================================================
// INPUT: keyboard, pointer/touch (multi-touch), focus and visibility
// ============================================================================
// Key/pointer releases only act while playing. Releases during a pause are picked up on
// resume by recheckHolds(), which drops only the holds whose lane is no longer held.
function laneUp(lane) { if (state === 'playing') releaseLane(lane); }

function recheckHolds() {
  if (!run) return;
  const s = songNow() - offset;
  for (const n of run.notes) {
    if (n.st === 'hold' && heldCount[n.lane] === 0) {
      if (s >= n.end - HOLD_TAIL) completeHold(n);
      else dropHold(n);
    }
  }
}

window.addEventListener('keydown', (e) => {
  const code = e.code;
  if (e.target && e.target.tagName === 'INPUT') {
    if (code === 'Enter' && state === 'title') { e.preventDefault(); startFromTitle(); }
    else if (code === 'Escape') seedEl.blur();
    return;
  }
  if (!ensureAudio()) return;

  if (state === 'title') {
    if (code === 'ArrowLeft') diffSel = Math.max(0, diffSel - 1);
    else if (code === 'ArrowRight') diffSel = Math.min(2, diffSel + 1);
    else if ((code === 'Enter' || code === 'Space') && !e.repeat) startFromTitle();
    else if (code === 'KeyC') startCal();
    else return;
    e.preventDefault();
    return;
  }
  if (state === 'results') {
    if (code === 'Enter' && !e.repeat) { e.preventDefault(); replay(); }
    else if (code === 'KeyN') newSong();
    else if (code === 'Escape' || code === 'KeyT') goTitle();
    return;
  }
  if (state === 'calibrate') {
    if (code === 'Escape') { goTitle(); return; }
    if ((code === 'Space' || LANE_KEYS[code] !== undefined) && !e.repeat) { e.preventDefault(); calTap(audioTimeOf(e)); }
    return;
  }
  // playing or paused
  if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); togglePause(); return; }
  if (state === 'playing' && LANE_KEYS[code] !== undefined) {
    e.preventDefault();
    if (e.repeat || keysDown.has(code)) return;
    keysDown.add(code);
    const l = LANE_KEYS[code];
    heldCount[l]++;
    pressLane(l, audioTimeOf(e));
  }
});

window.addEventListener('keyup', (e) => {
  const l = LANE_KEYS[e.code];
  if (l === undefined || !keysDown.has(e.code)) return;
  keysDown.delete(e.code);
  heldCount[l] = Math.max(0, heldCount[l] - 1);
  if (heldCount[l] === 0) laneUp(l);
});

function hitUI(x, y) {
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  ensureAudio();
  const p = toLogical(e);
  const b = hitUI(p.x, p.y);
  if (b) { b.fn(); return; }
  if (state === 'calibrate') { calTap(audioTimeOf(e)); return; }   // any tap that is not a button
  if (p.y < PAD_TOP) return;      // only the bottom third is a hit pad
  if (state === 'playing') {
    const lane = clamp(Math.floor(p.x / LANE_W), 0, 2);
    ptrLane.set(e.pointerId, lane);
    heldCount[lane]++;
    pressLane(lane, audioTimeOf(e));
  }
});

function endPointer(e) {
  const l = ptrLane.get(e.pointerId);
  if (l === undefined) return;
  ptrLane.delete(e.pointerId);
  heldCount[l] = Math.max(0, heldCount[l] - 1);
  if (heldCount[l] === 0) laneUp(l);
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

// Losing focus releases everything held, so no hold stays stuck.
function releaseAllInputs() {
  keysDown.clear();
  ptrLane.clear();
  for (let l = 0; l < 3; l++) {
    if (heldCount[l] > 0) {
      heldCount[l] = 0;
      laneUp(l);
    }
  }
}
window.addEventListener('blur', releaseAllInputs);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (state === 'playing') togglePause();
  if (state === 'calibrate') {
    goTitle();
    titleNote = 'Calibration cancelled: the tab was hidden.';
    titleNoteUntil = performance.now() + 5000;
  }
  releaseAllInputs();
});
window.addEventListener('resize', layout);

// ============================================================================
// RENDERING
// ============================================================================
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Draws a button and registers its hit rect for this frame.
function addBtn(c, x, y, w, h, label, fn, on = false, size = 18) {
  size = Math.max(minFont, size);   // readable floor (see layout)
  ui.push({ x, y, w, h, fn });
  c.save();
  rr(c, x, y, w, h, 10);
  c.fillStyle = on ? 'rgba(62,230,168,0.22)' : 'rgba(255,255,255,0.06)';
  c.fill();
  c.strokeStyle = on ? MINT : 'rgba(180,170,230,0.45)';
  c.lineWidth = 1.5;
  c.stroke();
  c.fillStyle = on ? '#eafff6' : INK;
  c.font = `bold ${size}px system-ui, sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(label, x + w / 2, y + h / 2);
  c.restore();
}

function text(c, s, x, y, size, color, align = 'center', weight = '') {
  size = Math.max(minFont, size);   // readable floor (see layout)
  c.save();
  c.fillStyle = color;
  c.font = `${weight} ${size}px system-ui, sans-serif`.trim();
  c.textAlign = align;
  c.textBaseline = 'middle';
  c.fillText(s, x, y);
  c.restore();
}

function bgGradient(c) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0b1a');
  g.addColorStop(1, '#1a1238');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
}

function drawTitle(c) {
  bgGradient(c);
  c.save();
  c.shadowColor = MINT;
  c.shadowBlur = 18;
  text(c, 'PULSE GARDEN', W / 2, 120, 44, '#e9fff6', 'center', 'bold');
  c.restore();
  text(c, 'Tap the beat. Grow the garden.', W / 2, 158, 16, '#a79fd0');

  DIFF_NAMES.forEach((name, i) => {
    const x = 40 + i * 140;
    addBtn(c, x, 200, 120, 44, name, () => { diffSel = i; }, i === diffSel);
    const b = best[name];
    text(c, b ? `best ${b.grade}` : 'no best yet', x + 60, 262, 14, '#8d86b8');
  });

  text(c, 'seed (blank = random)', W / 2, 292, 14, '#8d86b8');
  addBtn(c, 140, 370, 200, 52, 'PLAY', startFromTitle, true, 22);
  addBtn(c, 160, 440, 160, 40, 'Calibrate', startCal, false, 16);
  text(c, `latency offset ${Math.round(offset * 1000)} ms`, W / 2, 496, 13, '#8d86b8');

  const lines = [
    'Lanes: J K L or  ← ↓ →   (touch: tap the bottom third)',
    'Hold notes: keep the key or finger down to the end',
    'Pause: P or Esc.  Calibrate: C',
    'Perfect = +/-45 ms   Good = +/-90 ms',
  ];
  lines.forEach((s, i) => text(c, s, W / 2, 546 + i * 24, 14, '#b9b2e0'));
  if (noAudio) text(c, 'Web Audio is not available in this browser', W / 2, 660, 16, MISS_RED);
  if (titleNote && performance.now() < titleNoteUntil) text(c, titleNote, W / 2, 672, 16, GOLD);
}

function drawCal(c) {
  bgGradient(c);
  text(c, 'CALIBRATE', W / 2, 80, 36, '#e9fff6', 'center', 'bold');
  text(c, 'Count-in: 4 clicks. Then tap the next 4 beats.', W / 2, 124, 14, '#a79fd0');
  const now = ac ? ac.currentTime : 0;
  const k = (now - cal.base) / CAL_BEAT;
  const frac = k - Math.floor(k);
  const pulse = Math.max(0, 1 - frac * 4);
  c.save();
  c.shadowColor = GOLD;
  c.shadowBlur = 20 + pulse * 20;
  c.fillStyle = `rgba(255,214,107,${0.35 + pulse * 0.5})`;
  c.beginPath();
  c.arc(W / 2, 300, 60 + pulse * 18, 0, Math.PI * 2);
  c.fill();
  c.restore();
  const label = cal.done ? '' : k < 4 ? `count-in ${4 - Math.floor(Math.max(0, k))}` : 'tap on the beat';
  text(c, label, W / 2, 390, 18, INK);
  for (let i = 0; i < 4; i++) {
    c.save();
    c.fillStyle = cal.taps[i] ? GOLD : 'rgba(180,170,230,0.3)';
    c.beginPath();
    c.arc(W / 2 - 60 + i * 40, 430, 9, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
  if (cal.msg) text(c, cal.msg, W / 2, 490, 16, GOLD);
  addBtn(c, 160, 560, 160, 46, cal.done ? 'Done' : 'Back', goTitle, cal.done);
  drawParticles(c);
}

function drawPlay(c) {
  const sT = songNow();
  const song = run.song;
  const beat = song.beat;
  bgGradient(c);
  c.save();
  if (shake > 0) c.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);

  // Lane columns, with a flash on hits.
  for (let l = 0; l < 3; l++) {
    const g = c.createLinearGradient(0, PLAYTOP, 0, HIT_Y);
    const a = 0.05 + laneFlash[l] * 0.12;
    g.addColorStop(0, `rgba(${LANE_RGB[l]},0)`);
    g.addColorStop(1, `rgba(${LANE_RGB[l]},${a})`);
    c.fillStyle = g;
    c.fillRect(l * LANE_W + 1, PLAYTOP, LANE_W - 2, HIT_Y - PLAYTOP);
  }
  // Garden at the top.
  for (let l = 0; l < 3; l++) drawPlant(c, run.plants[l], 1, LANE_X[l], 232);

  drawNotes(c, sT, song.speed);

  // Hit pads (bottom third), split in three.
  for (let l = 0; l < 3; l++) {
    const x0 = l * LANE_W;
    c.fillStyle = `rgba(${LANE_RGB[l]},${heldCount[l] > 0 ? 0.25 : 0.07})`;
    rr(c, x0 + 4, PAD_TOP, LANE_W - 8, H - PAD_TOP - 8, 14);
    c.fill();
    text(c, ['J', 'K', 'L'][l], LANE_X[l], 700, 14, 'rgba(233,230,255,0.5)');
  }
  // Hit line and seed rings (pulse on the beat, from the audio clock).
  c.strokeStyle = 'rgba(233,230,255,0.12)';
  c.beginPath();
  c.moveTo(0, HIT_Y);
  c.lineTo(W, HIT_Y);
  c.stroke();
  const bp = sT / beat;
  const frac = bp - Math.floor(bp);
  const pulse = Math.max(0, 1 - frac * 4);
  for (let l = 0; l < 3; l++) {
    c.save();
    c.shadowColor = LANE_COL[l];
    c.shadowBlur = 12 + pulse * 14;
    c.strokeStyle = LANE_COL[l];
    c.lineWidth = 3;
    c.beginPath();
    c.arc(LANE_X[l], HIT_Y, 24 + pulse * 6, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }
  drawParticles(c);
  c.restore();

  // HUD (not shaken).
  const acc = accuracyOf(run);
  text(c, `score ${run.score}`, 12, 22, 18, INK, 'left', 'bold');
  text(c, `combo ${run.combo}`, 196, 22, 16, run.combo >= 25 ? GOLD : INK, 'center', 'bold');
  text(c, `${run.judged ? acc.toFixed(1) : '100.0'}%`, 300, 22, 15, '#b9b2e0', 'left');
  addBtn(c, 432, 8, 40, 28, 'II', togglePause, false, 14);
  // Song progress strip.
  c.fillStyle = MINT;
  c.fillRect(0, 0, Math.max(0, Math.min(1, sT / song.endSec)) * W, 3);

  if (sT < -0.05) {
    const count = LEAD_BEATS_UI - Math.floor((sT + song.leadSec) / beat);
    text(c, String(Math.max(1, count)), W / 2, 300, 96, 'rgba(233,230,255,0.85)', 'center', 'bold');
  }
  if (run.withered) text(c, 'The garden withered', W / 2, 330, 26, MISS_RED, 'center', 'bold');
}
const LEAD_BEATS_UI = 4;

function drawNotes(c, sT, speed) {
  for (const n of run.notes) {
    if (n.st === 'done') continue;
    const x = LANE_X[n.lane];
    const col = LANE_COL[n.lane];
    if (n.st === 'wait') {
      const yHead = HIT_Y - (n.t - sT) * speed;
      const yTail = n.hold ? HIT_Y - (n.end - sT) * speed : yHead;
      if (yHead < PLAYTOP - 30 && yTail < PLAYTOP - 30) continue;
      if (yTail > H) continue;
      if (n.hold) drawTube(c, x, Math.max(yTail, PLAYTOP), yHead, col);
      if (yHead >= PLAYTOP - 30 && yHead <= H) drawSeed(c, x, yHead, col, 11, 14);
    } else if (n.st === 'hold') {
      const yTail = HIT_Y - (n.end - sT) * speed;
      drawTube(c, x, Math.max(yTail, PLAYTOP), HIT_Y, col);
      drawSeed(c, x, HIT_Y, col, 13, 22);
    }
  }
}

function drawTube(c, x, yTop, yBottom, col) {
  if (yBottom <= yTop) return;
  c.save();
  c.globalAlpha = 0.4;
  c.fillStyle = col;
  rr(c, x - 6, yTop, 12, yBottom - yTop, 6);
  c.fill();
  c.restore();
}

function drawSeed(c, x, y, col, r, glow) {
  c.save();
  c.shadowColor = col;
  c.shadowBlur = glow;
  c.fillStyle = col;
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fill();
  c.shadowBlur = 0;
  c.fillStyle = 'rgba(255,255,255,0.75)';
  c.beginPath();
  c.arc(x - r * 0.3, y - r * 0.3, r * 0.3, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function drawParticles(c) {
  for (const p of parts) {
    const a = Math.max(0, Math.min(1, p.life / p.max));
    c.save();
    c.globalAlpha = a;
    c.fillStyle = p.c;
    c.beginPath();
    c.arc(p.x, p.y, p.s * (0.5 + a * 0.5), 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
  for (const t of texts) {
    const a = Math.max(0, t.life / t.max);
    text(c, t.t, t.x, t.y - (1 - a) * 26, 20, t.c, 'center', 'bold');
  }
}

function drawPauseOverlay(c) {
  c.fillStyle = 'rgba(13,11,26,0.72)';
  c.fillRect(0, 0, W, H);
  text(c, 'PAUSED', W / 2, 300, 40, '#e9fff6', 'center', 'bold');
  text(c, 'P or Esc to resume', W / 2, 340, 15, '#a79fd0');
  addBtn(c, 150, 380, 180, 46, 'Resume', togglePause, true);
  addBtn(c, 150, 442, 180, 46, 'Quit to title', goTitle);
}

function drawResults(c) {
  bgGradient(c);
  text(c, run.withered ? 'The garden withered' : 'The garden grew', W / 2, 40, 18, '#a79fd0', 'center', 'bold');
  for (let l = 0; l < 3; l++) drawPlant(c, run.plants[l], 1.9, LANE_X[l], 430);
  c.strokeStyle = 'rgba(233,230,255,0.15)';
  c.beginPath();
  c.moveTo(20, 432);
  c.lineTo(W - 20, 432);
  c.stroke();

  const col = run.grade === 'S' ? GOLD : run.grade === 'D' ? MISS_RED : MINT;
  c.save();
  c.shadowColor = col;
  c.shadowBlur = 24;
  text(c, run.grade, W / 2, 486, 92, col, 'center', 'bold');
  c.restore();
  const c2 = run.counts;
  text(c, `accuracy ${run.acc.toFixed(1)}%    max combo ${run.maxCombo}`, W / 2, 540, 16, INK);
  text(c, `score ${run.score}`, W / 2, 564, 16, INK);
  text(c, `Perfect ${c2.Perfect}  Good ${c2.Good}  Miss ${c2.Miss}  Holds ${c2.Hold}`, W / 2, 588, 13, '#b9b2e0');
  text(c, `${run.diff}  ·  seed ${run.seed}`, W / 2, 610, 13, '#8d86b8');
  addBtn(c, 40, 634, 190, 44, 'Replay this song', replay, true, 15);
  addBtn(c, 250, 634, 190, 44, 'New song', newSong, false, 15);
  addBtn(c, 160, 686, 160, 32, 'Title', goTitle, false, 16);
}

function draw() {
  cx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  cx.clearRect(0, 0, W, H);
  switch (state) {
    case 'title': drawTitle(cx); break;
    case 'calibrate': drawCal(cx); break;
    case 'playing': drawPlay(cx); break;
    case 'paused':
      drawPlay(cx);
      drawPauseOverlay(cx);
      break;
    case 'results': drawResults(cx); break;
    default: break;
  }
}

// ============================================================================
// MAIN LOOP (requestAnimationFrame). Visual smoothing uses frame dt (clamped).
// Judgment and timing never use this dt: they use the audio clock.
// ============================================================================
function updateVisuals(dt) {
  shake *= Math.exp(-dt * 12);
  if (shake < 0.05) shake = 0;
  for (let i = 0; i < 3; i++) laneFlash[i] = Math.max(0, laneFlash[i] - dt * 4);
  for (const p of parts) {
    p.life -= dt;
    p.vy += 260 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  for (let i = texts.length - 1; i >= 0; i--) {
    texts[i].life -= dt;
    if (texts[i].life <= 0) texts.splice(i, 1);
  }
}

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  updateVisuals(dt);
  if (state === 'playing' && run) updateRun(dt);
  if (state === 'calibrate') updateCal();
  ui = [];
  draw();
  requestAnimationFrame(frame);
}

layout();
setState('title');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
