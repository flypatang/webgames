<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Wisp Herder</title>
<style>
  html, body { margin: 0; height: 100%; background: #03060c; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ==========================================================================
   WISP HERDER
   Single-file canvas game. Logical field 800x600 (landscape) or 600x800
   (portrait), scaled and letterboxed to the window.
   Sections: 1 config · 2 state & layout · 3 audio · 4 night setup · 5 flock
             6 moths & keeper · 7 rules & flow · 8 input · 9 rendering · 10 loop
   ========================================================================== */

/* ---------- 1. CONFIG ---------- */
const STEP = 1 / 60;                          // fixed simulation step (s)
const TAU = Math.PI * 2;
const KEEPER_R = 12, KEEPER_SPEED = 170, KEEPER_REACH = 6, REPEL_R = 110;
const FLARE_CD = 3, FLARE_R = 200, FLARE_V = 260, FLARE_STUN = 2;
const WISP_R = 5, WISP_MAX_V = 90, WISP_MAX_F = 140;
const SEP_R = 18, ALI_R = 50, COH_R = 60;
const W_SEP = 1.6, W_ALI = 0.8, W_COH = 0.7, W_WANDER = 0.3, W_EDGE = 1.5, W_REPEL = 2.5;
const EDGE_R = 30;
const GATE_LEN = 120, GATE_DEPTH = 60;
const SAVE_PTS = 10;
const MOTH_R = 9, MOTH_V = 60, MOTH_REPEL = 3.0, MOTH_KILL_R = MOTH_R + WISP_R;
const MOTH_FEED = 2.5, MOTH_FEED_STUN = 4, FEAR_R = 70, FEAR_W = 1.8;   // feeding time, stun when fed on, wisp fear
const MOTH_RESPAWN = 4, MOTH_DELAY = 2, MAX_MOTHS = 5;
const PASS_FRAC = 0.6, TIME_BONUS = 5, PERFECT_BONUS = 100;
const WIND_START_NIGHT = 4, WIND_EVERY = 10, WIND_DUR = 2, WIND_V = 40;
const SPAWN_R = 80, SPAWN_DEPTH = 0.78, SPAWN_CLEAR = 90, SHRINE_CLEAR = 90;
const MAX_WISPS = 40;
const STUCK_V = 5, STUCK_T = 2.5, NUDGE_V = 60;
const GUARD_T = 0.6;                          // s before summary/game-over accept input
const BEST_KEY = 'wispHerder.best';
const EDGES = ['left', 'top', 'right', 'bottom'];
const EDGE_DEF = {
  left:   { nx: 1,  ny: 0,  tx: 0, ty: 1 },   // nx,ny = inward normal; tx,ty = tangent
  right:  { nx: -1, ny: 0,  tx: 0, ty: 1 },
  top:    { nx: 0,  ny: 1,  tx: 1, ty: 0 },
  bottom: { nx: 0,  ny: -1, tx: 1, ty: 0 },
};
const CTRL = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
};
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

/* ---------- 2. STATE & LAYOUT ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lightCv = document.createElement('canvas');   // darkness overlay buffer
const lctx = lightCv.getContext('2d');

let W = 800, H = 600;                         // logical field (set by layout)
let DPR = 1, SC = 1, OX = 0, OY = 0;          // device scale, fit scale, letterbox offset (CSS px)
const view = { scale: 1, ox: 0, oy: 0 };      // exposed for the test bot (CSS px)

// Fits the field to the window. Returns true when the logical size changed.
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const portrait = vh > vw;
  const nW = portrait ? 600 : 800, nH = portrait ? 800 : 600;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(vw * DPR);
  cv.height = Math.round(vh * DPR);
  cv.style.width = vw + 'px';
  cv.style.height = vh + 'px';
  lightCv.width = cv.width;
  lightCv.height = cv.height;
  SC = Math.min(vw / nW, vh / nH);
  OX = (vw - nW * SC) / 2;
  OY = (vh - nH * SC) / 2;
  view.scale = SC; view.ox = OX; view.oy = OY;
  const changed = nW !== W || nH !== H;
  W = nW; H = nH;
  return changed;
}
// Maps logical coordinates to device pixels (sx, sy = shake offset in logical units).
function setView(c, sx, sy) {
  c.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * (OX + sx), DPR * (OY + sy));
}

// Game state. state: title | playing | paused | summary | over
let state = 'title';
let night = 1, N = 12, needed = 8, timeLeft = 65, saved = 0, lost = 0;
let score = 0, best = loadBest();
let demo = false, demoT = 0;
let gate = null, walls = [], spawnC = { x: 0, y: 0 }, lastEdge = null;
let obstacles = [], wisps = [], moths = [], pendingMoths = [];
let keeper = { x: 0, y: 0, vx: 0, vy: 0, fcd: 0 };
let endT = -1, guard = 0, banner = 0;
let windTimer = WIND_EVERY, windNext = null, windDir = 0, windLeft = 0;
let summary = null, nudges = 0, elapsed = 0;
let particles = [], rings = [], floaters = [];
let shake = { t: 0, m: 0 };
let grass = null;
let keys = {}, ptrId = null, ptrTarget = null, lastTapT = 0, lastTapX = 0, lastTapY = 0;
let frameMs = 0;

// Exposed for the smoke test and debugging; kept current every frame.
const game = window.__game = {
  state, score, best, night: 1, N: 0, needed: 0, saved: 0, lost: 0, timeLeft: 0,
  flareCd: 0, keeper, wisps, moths, obstacles, gate: null, W, H, view, nudges: 0, frameMs: 0,
};
function syncGame() {
  game.state = state; game.score = score; game.best = best; game.night = night;
  game.N = N; game.needed = needed; game.saved = saved; game.lost = lost;
  game.timeLeft = timeLeft; game.flareCd = keeper.fcd; game.keeper = keeper;
  game.wisps = wisps; game.moths = moths; game.obstacles = obstacles;
  game.gate = gate ? { edge: gate.edge, ex: gate.ex, ey: gate.ey } : null;
  game.W = W; game.H = H; game.nudges = nudges; game.frameMs = frameMs;
}

function loadBest() {
  try {
    const v = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    return isFinite(v) && v > 0 ? v : 0;
  } catch (e) { return 0; }
}
function saveBest() {
  try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* storage blocked: ignore */ }
}
function addScore(n) {
  score += n;
  if (score > best) best = score;
}

/* ---------- 3. AUDIO (WebAudio synthesis, created on first input) ---------- */
let AC = null, master = null, noiseBuf = null;
function ensureAudio() {
  try {
    if (!AC) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      master = AC.createGain();
      master.gain.value = 0.25;
      master.connect(AC.destination);
      const len = Math.floor(AC.sampleRate * 0.5);
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, when = 0, slideTo = null) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime + when;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) { /* audio unavailable */ }
}
function noise(dur, f0, f1, vol) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  } catch (e) { /* audio unavailable */ }
}
const sfx = {
  chime(n) {                                  // rising pentatonic note by count
    const steps = [0, 2, 4, 7, 9];
    const oct = Math.min(2, Math.floor(n / 5));
    const f = 660 * Math.pow(2, (steps[n % 5] + 12 * oct) / 12);
    tone(f, 0.45, 'sine', 0.18);
    tone(f * 2, 0.3, 'sine', 0.05, 0.02);
  },
  thud() { tone(120, 0.3, 'sine', 0.35, 0, 45); },
  whoosh() { noise(0.4, 300, 2400, 0.3); },
  chord() { [262, 330, 392].forEach((f, i) => tone(f, 1.2, 'triangle', 0.12, i * 0.06)); },
  fail() { tone(196, 0.7, 'sawtooth', 0.06, 0, 98); },
};

/* ---------- 4. NIGHT SETUP ---------- */
function nightParams(n) {
  return {
    N: Math.min(MAX_WISPS, 12 + 4 * (n - 1)),
    moths: Math.min(MAX_MOTHS, n - 1),
    obstacles: Math.min(6, 3 + Math.floor(n / 2)),
    time: 70 + 5 * n,
  };
}
// Wall segment on one edge: centre (ex,ey), inward normal (nx,ny), tangent (tx,ty).
function makeWall(edge, isGate) {
  const ex = edge === 'left' ? 0 : edge === 'right' ? W : W / 2;
  const ey = edge === 'top' ? 0 : edge === 'bottom' ? H : H / 2;
  return { edge, ex, ey, ...EDGE_DEF[edge], gate: isGate };
}
// Coordinates relative to a wall: dn = distance inward, dt = offset along the wall.
function localTo(w, x, y) {
  const ux = x - w.ex, uy = y - w.ey;
  return { dn: ux * w.nx + uy * w.ny, dt: ux * w.tx + uy * w.ty };
}
function inZone(x, y) {
  const l = localTo(gate, x, y);
  return l.dn >= 0 && l.dn <= GATE_DEPTH && Math.abs(l.dt) <= GATE_LEN / 2;
}
// Distance from a point to the shrine zone rectangle (0 when inside).
function zoneDist(x, y) {
  const l = localTo(gate, x, y);
  const cn = clamp(l.dn, 0, GATE_DEPTH), ct = clamp(l.dt, -GATE_LEN / 2, GATE_LEN / 2);
  return Math.hypot(l.dn - cn, l.dt - ct);
}
function placeObstacles(count) {
  const out = [];
  for (let tries = 0; tries < 800 && out.length < count; tries++) {
    const r = rand(20, 45);
    const x = rand(r + 10, W - r - 10), y = rand(r + 10, H - r - 10);
    if (zoneDist(x, y) < r + SHRINE_CLEAR) continue;
    if (Math.hypot(x - spawnC.x, y - spawnC.y) < r + SPAWN_R + SPAWN_CLEAR) continue;
    if (Math.hypot(x - W / 2, y - H / 2) < r + KEEPER_R + 40) continue;
    if (out.some(o => Math.hypot(x - o.x, y - o.y) < r + o.r + 20)) continue;
    out.push({ x, y, r });
  }
  return out;
}
function newWisp(x, y) {
  const a = Math.random() * TAU, s = Math.random() * 30;
  return {
    x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
    wa: Math.random() * TAU, phase: Math.random() * TAU, a0: 0,
    st: 'flock', t: 0, still: 0, alpha: 1, trail: [],
  };
}
function spawnWisps(count) {
  wisps = [];
  for (let i = 0; i < count; i++) {
    let x = 0, y = 0;
    for (let tries = 0; tries < 40; tries++) {
      const a = Math.random() * TAU, rr = Math.sqrt(Math.random()) * SPAWN_R;
      x = clamp(spawnC.x + Math.cos(a) * rr, WISP_R, W - WISP_R);
      y = clamp(spawnC.y + Math.sin(a) * rr, WISP_R, H - WISP_R);
      if (!obstacles.some(o => Math.hypot(x - o.x, y - o.y) < o.r + WISP_R + 2)) break;
    }
    wisps.push(newWisp(x, y));
  }
}
function pickEdge() {
  const opts = EDGES.filter(e => e !== lastEdge);
  return opts[Math.floor(Math.random() * opts.length)];
}
function setupNight(n) {
  const p = nightParams(n);
  night = n; N = p.N;
  needed = Math.ceil(PASS_FRAC * N - 1e-9);
  timeLeft = p.time; saved = 0; lost = 0; endT = -1; nudges = 0;
  const edge = pickEdge();
  lastEdge = edge;
  gate = makeWall(edge, true);
  walls = EDGES.map(e => (e === edge ? gate : makeWall(e, false)));
  const depth = (edge === 'left' || edge === 'right') ? W : H;
  spawnC = { x: gate.ex + gate.nx * SPAWN_DEPTH * depth, y: gate.ey + gate.ny * SPAWN_DEPTH * depth };
  obstacles = placeObstacles(p.obstacles);
  spawnWisps(N);
  moths = [];
  pendingMoths = demo ? [] : Array.from({ length: p.moths }, () => MOTH_DELAY);
  keeper = { x: W / 2, y: H / 2, vx: 0, vy: 0, fcd: 0 };
  windTimer = WIND_EVERY; windNext = null; windLeft = 0;
  particles = []; rings = []; floaters = [];
  banner = 1.8;
}
// Title-screen backdrop: a flock circling behind the title, no scoring.
function setupDemo() {
  demo = true;
  setupNight(1);
  demoT = 0;
}
// Orientation change mid-night: moves every entity proportionally from the old field
// size to the new one. Timer, saved/lost counts, score and wind state are untouched.
function remapField(oldW, oldH) {
  const sx = W / oldW, sy = H / oldH, sr = Math.sqrt(sx * sy);   // sr keeps obstacle area
  for (const o of obstacles) {
    o.x *= sx; o.y *= sy; o.r *= sr;
    o.x = clamp(o.x, o.r, W - o.r); o.y = clamp(o.y, o.r, H - o.r);
  }
  spawnC.x *= sx; spawnC.y *= sy;
  if (gate) {                                 // same edge; the gate stays centred on it
    gate = makeWall(gate.edge, true);
    walls = EDGES.map(e => (e === gate.edge ? gate : makeWall(e, false)));
  }
  keeper.x *= sx; keeper.y *= sy; keeper.vx *= sx; keeper.vy *= sy;
  pushOut(keeper, KEEPER_R); clampField(keeper, KEEPER_R);
  for (const w of wisps) {
    w.x *= sx; w.y *= sy; w.vx *= sx; w.vy *= sy;
    for (const p of w.trail) { p.x *= sx; p.y *= sy; }
    if (w.st === 'flock') pushOut(w, WISP_R);
    clampField(w, WISP_R);
  }
  for (const m of moths) {
    m.x *= sx; m.y *= sy; m.vx *= sx; m.vy *= sy; m.kx *= sx; m.ky *= sy;
    m.x = clamp(m.x, MOTH_R, W - MOTH_R); m.y = clamp(m.y, MOTH_R, H - MOTH_R);
  }
  for (const p of particles) { p.x *= sx; p.y *= sy; }
  for (const r of rings) { r.x *= sx; r.y *= sy; }
  for (const f of floaters) { f.x *= sx; f.y *= sy; }
}

/* ---------- 5. FLOCK (boids + keeper repel + edges + obstacles) ---------- */
const F = { x: 0, y: 0 };                     // steering accumulator
function addSteer(w, dx, dy, weight) {
  const m = Math.hypot(dx, dy);
  if (m < 1e-6 || weight <= 0) return;
  F.x += weight * ((dx / m) * WISP_MAX_V - w.vx);
  F.y += weight * ((dy / m) * WISP_MAX_V - w.vy);
}
function stepFlockWisp(w, flock, dt) {
  F.x = 0; F.y = 0;
  let sx = 0, sy = 0, ax = 0, ay = 0, an = 0, cx = 0, cy = 0, cn = 0;
  for (const o of flock) {
    if (o === w) continue;
    const dx = w.x - o.x, dy = w.y - o.y, d2 = dx * dx + dy * dy;
    if (d2 < COH_R * COH_R) {
      cx += o.x; cy += o.y; cn++;
      if (d2 < ALI_R * ALI_R) { ax += o.vx; ay += o.vy; an++; }
      if (d2 < SEP_R * SEP_R) { const inv = 1 / (d2 + 0.5); sx += dx * inv; sy += dy * inv; }
    }
  }
  addSteer(w, sx, sy, W_SEP);
  if (an) addSteer(w, ax, ay, W_ALI);
  if (cn) addSteer(w, cx / cn - w.x, cy / cn - w.y, W_COH);
  w.wa += rand(-3, 3) * dt;
  addSteer(w, Math.cos(w.wa), Math.sin(w.wa), W_WANDER);
  for (const wl of walls) {
    const l = localTo(wl, w.x, w.y);
    if (wl.gate && Math.abs(l.dt) <= GATE_LEN / 2) continue;   // the shrine gap is open
    if (l.dn < EDGE_R) addSteer(w, wl.nx, wl.ny, W_EDGE * (1 - Math.max(0, l.dn) / EDGE_R));
  }
  const kx = w.x - keeper.x, ky = w.y - keeper.y, kd = Math.hypot(kx, ky);
  if (kd < REPEL_R) { const s = 1 - kd / REPEL_R; addSteer(w, kx, ky, W_REPEL * s * s); }
  for (const m of moths) {                    // wisps fear moths within 70 px
    if (!m.gone && Math.hypot(w.x - m.x, w.y - m.y) < FEAR_R) addSteer(w, w.x - m.x, w.y - m.y, FEAR_W);
  }
  const fm = Math.hypot(F.x, F.y);
  if (fm > WISP_MAX_F) { F.x *= WISP_MAX_F / fm; F.y *= WISP_MAX_F / fm; }
  w.vx += F.x * dt; w.vy += F.y * dt;
  // Flare impulses above max speed decay back toward it.
  const sp0 = Math.hypot(w.vx, w.vy);
  if (sp0 > WISP_MAX_V) {
    const k = (WISP_MAX_V + (sp0 - WISP_MAX_V) * Math.exp(-3 * dt)) / sp0;
    w.vx *= k; w.vy *= k;
  }
  w.x += w.vx * dt; w.y += w.vy * dt;
  pushOut(w, WISP_R);
  clampField(w, WISP_R);
  // Anti-stuck safety net: a wisp that barely moves for 2.5 s gets a random nudge.
  const sp = Math.hypot(w.vx, w.vy);
  if (sp < STUCK_V) {
    w.still += dt;
    if (w.still > STUCK_T) {
      const a = Math.random() * TAU;
      w.vx += Math.cos(a) * NUDGE_V; w.vy += Math.sin(a) * NUDGE_V;
      w.still = 0; nudges++;
    }
  } else w.still = 0;
  w.trail.push({ x: w.x, y: w.y });
  if (w.trail.length > 5) w.trail.shift();
  if (!demo && inZone(w.x, w.y)) saveWisp(w);
}
function stepWisps(dt) {
  const flock = wisps.filter(w => w.st === 'flock');
  for (const w of flock) stepFlockWisp(w, flock, dt);
  for (const w of wisps) if (w.st !== 'flock') stepFading(w, dt);
  wisps = wisps.filter(w => w.st === 'flock' || w.t < (w.st === 'saved' ? 0.9 : 1.2));
}
function saveWisp(w) {
  w.st = 'saved'; w.t = 0; w.alpha = 1;
  w.a0 = Math.atan2(w.y - (gate.ey + gate.ny * 30), w.x - (gate.ex + gate.nx * 30));
  saved++;
  addScore(SAVE_PTS);
  sfx.chime(saved - 1);
  burst(w.x, w.y, '#8fffc1', 10, 60, 0.6);
  floaters.push({ x: w.x, y: w.y, text: '+' + SAVE_PTS, life: 0.8, max: 0.8, color: '#8fffc1' });
}
function loseWisp(w, from) {
  w.st = 'lost'; w.t = 0; lost++;
  const a = from ? Math.atan2(w.y - from.y, w.x - from.x) : Math.random() * TAU;
  w.vx = Math.cos(a) * 120; w.vy = Math.sin(a) * 120;
  sfx.thud();
  burst(w.x, w.y, '#9b6bd6', 8, 50, 0.5);
}
// Saved wisps spiral into the shrine; lost wisps drift off and dim.
function stepFading(w, dt) {
  w.t += dt;
  if (w.st === 'saved') {
    const tx = gate.ex + gate.nx * 30, ty = gate.ey + gate.ny * 30;
    const ang = w.a0 + w.t * 9, rad = Math.max(0, 16 * (1 - w.t / 0.9));
    w.x += (tx + Math.cos(ang) * rad - w.x) * Math.min(1, dt * 12);
    w.y += (ty + Math.sin(ang) * rad - w.y) * Math.min(1, dt * 12);
    w.alpha = clamp(1 - w.t / 0.9, 0, 1);
  } else {
    const k = Math.exp(-3 * dt);
    w.vx *= k; w.vy *= k;
    w.x += w.vx * dt; w.y += w.vy * dt;
    w.alpha = clamp(0.5 * (1 - w.t / 1.2), 0, 1);
  }
}
// Pushes a circle out of every obstacle; removes the velocity component into it.
function pushOut(p, r) {
  for (const o of obstacles) {
    const dx = p.x - o.x, dy = p.y - o.y, d = Math.hypot(dx, dy), min = o.r + r;
    if (d >= min) continue;
    const nx = d > 1e-6 ? dx / d : 1, ny = d > 1e-6 ? dy / d : 0;
    p.x = o.x + nx * min; p.y = o.y + ny * min;
    const vn = (p.vx || 0) * nx + (p.vy || 0) * ny;
    if (vn < 0) { p.vx -= vn * nx; p.vy -= vn * ny; }
  }
}
function clampField(p, r) {
  if (p.x < r) { p.x = r; if (p.vx < 0) p.vx = 0; }
  if (p.x > W - r) { p.x = W - r; if (p.vx > 0) p.vx = 0; }
  if (p.y < r) { p.y = r; if (p.vy < 0) p.vy = 0; }
  if (p.y > H - r) { p.y = H - r; if (p.vy > 0) p.vy = 0; }
}

/* ---------- 6. MOTHS, KEEPER, WIND ---------- */
function edgePoint() {
  const e = Math.floor(Math.random() * 4), t = Math.random();
  if (e === 0) return { x: MOTH_R, y: rand(MOTH_R, H - MOTH_R) };

  ctx.beginPath();

  ctx.lineTo(ex - Math.cos(dir - 0.5) * 16, ey - Math.sin(dir - 0.5) * 16);
  ctx.lineTo(ex - Math.cos(dir + 0.5) * 16, ey - Math.sin(dir + 0.5) * 16);
  ctx.closePath(); ctx.fill();
  text('WIND', cx, cy - 46, 14, `rgba(191,248,255,${a})`);
  ctx.restore();
}
function drawHUD() {
  const hud = (size) => Math.max(size, 13 / SC);   // HUD text is at least 13 CSS px on screen
  const pb = pauseRect();
  text(`NIGHT ${night}`, 14, 20, hud(16), '#e6feff', 'left');
  text(`${Math.ceil(Math.max(0, timeLeft))}s`, 14, 46, hud(14), '#9fb4c8', 'left');
  text(`${saved} / ${needed} needed of ${N}`, W / 2, 20, hud(16), saved >= needed ? '#8fffc1' : '#e6feff');
  text(`${score}`, pb.x - 10, 20, hud(16), '#ffd98a', 'right');
  // Button: visual square centred in the (possibly larger) hit box.
  const vx = pb.x + (pb.w - PAUSE_VIS) / 2, vy = pb.y + (pb.h - PAUSE_VIS) / 2;
  roundRect(vx, vy, PAUSE_VIS, PAUSE_VIS, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  ctx.strokeStyle = 'rgba(191,248,255,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e6feff';
  const cx = vx + PAUSE_VIS / 2, cy = vy + PAUSE_VIS / 2;
  ctx.fillRect(cx - 9, cy - 10, 6, 20);
  ctx.fillRect(cx + 3, cy - 10, 6, 20);
  if (banner > 0) text(`Night ${night}`, W / 2, H * 0.4, 36, `rgba(230,254,255,${Math.min(1, banner)})`);
}
function drawTitle(t) {
  dim(0.3);
  ctx.shadowColor = 'rgba(191,248,255,0.8)';
  ctx.shadowBlur = 24;
  text('WISP HERDER', W / 2, H * 0.2, Math.min(56, W * 0.075), '#bff8ff', 'center', '800');
  ctx.shadowBlur = 0;
  text('Push the flock into the shrine before the', W / 2, H * 0.31, 17, '#c8d6e6');
  text('shadow-moths pick off the stragglers.', W / 2, H * 0.31 + 24, 17, '#c8d6e6');
  const pw = Math.min(W * 0.84, 500), px = (W - pw) / 2, py = H * 0.42;
  panel(px, py, pw, 118);
  text('Move    WASD / Arrows  |  touch: walk to your finger', W / 2, py + 26, 15, '#e6feff');
  text('Flare   Space  |  double-tap or right-click  (3 s)', W / 2, py + 58, 15, '#e6feff');
  text('Pause   P / Esc  |  pause button', W / 2, py + 90, 15, '#e6feff');
  text('Press Enter, Space or tap to start', W / 2, H * 0.7, 18, `rgba(255,217,138,${0.6 + 0.4 * Math.sin(t * 3)})`);
  text(`Best ${best}`, W / 2, H * 0.8, 16, '#9fb4c8');
}
function drawSummaryCard() {
  const s = summary;
  dim(0.45);
  const pw = Math.min(W * 0.84, 460), ph = 262, px = (W - pw) / 2, py = (H - ph) / 2;
  panel(px, py, pw, ph);
  text(s.pass ? `Night ${s.night} cleared` : `Night ${s.night} failed`, W / 2, py + 34, 24, s.pass ? '#8fffc1' : '#ff8fa3', 'center', '800');
  text(`Saved   ${s.saved} / ${s.needed} needed (of ${s.N})`, W / 2, py + 84, 17, '#e6feff');
  text(`Lost    ${s.lost}`, W / 2, py + 112, 17, '#e6feff');
  let row = 140;
  if (s.pass) { text(`Time bonus   +${s.tb}`, W / 2, py + row, 17, '#c8d6e6'); row += 26; }
  if (s.pb) { text(`Perfect   +${s.pb}`, W / 2, py + row, 17, '#ffd98a'); row += 26; }
  text(`Score   ${score}`, W / 2, py + row + 6, 19, '#ffd98a', 'center', '800');
  const ready = guard <= 0;
  text(s.pass ? 'Tap or Space: next night' : 'Tap or Space: see results', W / 2, py + ph - 26, 15,
    ready ? '#e6feff' : 'rgba(230,254,255,0.35)');
}
function drawOverCard() {
  dim(0.6);
  const pw = Math.min(W * 0.84, 420), ph = 230, px = (W - pw) / 2, py = (H - ph) / 2;
  panel(px, py, pw, ph);
  text('GAME OVER', W / 2, py + 40, 28, '#ff8fa3', 'center', '800');
  text(`Reached night ${night}`, W / 2, py + 84, 18, '#e6feff');
  text(`Score ${score}`, W / 2, py + 114, 18, '#ffd98a');
  text(`Best ${best}`, W / 2, py + 142, 16, '#9fb4c8');
  text('Tap or Space to restart', W / 2, py + ph - 28, 15, guard <= 0 ? '#e6feff' : 'rgba(230,254,255,0.35)');
}
function drawPauseCard() {
  dim(0.5);
  text('PAUSED', W / 2, H / 2 - 14, 32, '#e6feff', 'center', '800');
  text('P / Esc or tap to resume', W / 2, H / 2 + 22, 16, '#9fb4c8');
}
function render(now) {
  const t = now / 1000;
  const sx = shake.t > 0 ? rand(-shake.m, shake.m) : 0;
  const sy = shake.t > 0 ? rand(-shake.m, shake.m) : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#03060c';
  ctx.fillRect(0, 0, cv.width, cv.height);
  setView(ctx, sx, sy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawField();
  drawDarkness(sx, sy);
  drawMoths(t);
  ctx.globalCompositeOperation = 'lighter';
  drawShrine(t);
  drawWisps(t);
  ctx.globalCompositeOperation = 'source-over';
  drawKeeper(t);
  drawFx();
  drawWindArrow(t);
  if (state !== 'title') drawHUD();
  ctx.restore();
  // Overlays are not shaken.
  setView(ctx, 0, 0);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (state === 'title') drawTitle(t);
  else if (state === 'paused') drawPauseCard();
  else if (state === 'summary' && summary) drawSummaryCard();
  else if (state === 'over') drawOverCard();
  ctx.restore();
}

/* ---------- 10. MAIN LOOP (fixed timestep, dt clamped to 50 ms) ---------- */
function updateRealtime(dt) {
  guard = Math.max(0, guard - dt);
  banner = Math.max(0, banner - dt);
  shake.t = Math.max(0, shake.t - dt);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.exp(-2 * dt); p.vy *= Math.exp(-2 * dt);
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) {
    r.life -= dt;
    r.r = FLARE_R * (1 - Math.max(0, r.life) / r.max);
  }
  rings = rings.filter(r => r.life > 0);
  for (const f of floaters) { f.y -= 30 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
}
let lastT = performance.now(), acc = 0;
function frame(now) {
  const t0 = performance.now();
  const dt = clamp((now - lastT) / 1000, 0, 0.05);
  lastT = now;
  elapsed += dt;
  if (state === 'title' || state === 'playing') {
    acc += dt;
    while (acc >= STEP && (state === 'title' || state === 'playing')) {
      if (state === 'title') updateDemo(STEP); else updatePlaying(STEP);
      acc -= STEP;
    }
  } else {
    acc = 0;
  }
  updateRealtime(dt);
  render(now);
  syncGame();
  frameMs = frameMs * 0.9 + (performance.now() - t0) * 0.1;
  requestAnimationFrame(frame);
}

layout();
setupDemo();
syncGame();
requestAnimationFrame(frame);
</script>
